<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>I love you ❤️</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100vw;height:100vh;background:#000}
</style>
</head>
<body>
<canvas id="heart"></canvas>
<script>
const canvas=document.getElementById("heart");
const ctx=canvas.getContext("2d");

function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.floor(innerWidth*dpr);
  canvas.height=Math.floor(innerHeight*dpr);
  canvas.style.width=innerWidth+"px";
  canvas.style.height=innerHeight+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
addEventListener("resize",resize);

/*
  Keep the exact Python/Turtle drawing order:
  scale 11 completely, then 12, then 13 ... through 16.
*/
const points=[];
for(let scale=11;scale<17;scale++){
  for(let i=0;i<120;i++){
    const angle=i*(Math.PI*2)/120;
    const x=16*(Math.sin(angle)**3)*scale;
    const y=(13*Math.cos(angle)
      -5*Math.cos(2*angle)
      -2*Math.cos(3*angle)
      -Math.cos(4*angle))*scale;
    points.push({x,y});
  }
}

let index=0;

/* Half the previous speed */
const pointsPerSecond=12;

let lastTime=performance.now();

function draw(now){
  const w=innerWidth,h=innerHeight;

  ctx.fillStyle="#000";
  ctx.fillRect(0,0,w,h);

  /*
    Use one consistent coordinate scale and center,
    so the proportions match the Turtle heart instead
    of changing with the browser's aspect ratio.
  */
  const fit=Math.min(w/600,h/600);

  ctx.fillStyle="#ffb6c1";
  ctx.font='bold 8px Arial';
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  for(let i=0;i<Math.floor(index);i++){
    const p=points[i];
    ctx.fillText(
      "I love you",
      w/2+p.x*fit,
      h/2-p.y*fit
    );
  }

  if(index<points.length){
    const elapsed=(now-lastTime)/1000;
    index+=elapsed*pointsPerSecond;
    lastTime=now;
    requestAnimationFrame(draw);
  }
}

requestAnimationFrame(draw);
</script>
</body>
</html>
