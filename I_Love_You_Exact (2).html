<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>I love you ❤️</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
canvas{width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById("c"),ctx=c.getContext("2d");
function resize(){
  const d=devicePixelRatio||1;
  c.width=innerWidth*d;c.height=innerHeight*d;
  ctx.setTransform(d,0,0,d,0,0);
}
resize();addEventListener("resize",resize);

let scale=1;
function draw(){
  const w=innerWidth,h=innerHeight;
  ctx.fillStyle="black";ctx.fillRect(0,0,w,h);

  /* Same mathematical heart as the Python Turtle code */
  const fit=Math.min(w,h)/430;

  ctx.fillStyle="#ffb6c1";
  ctx.font="bold 8px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  for(let s=11;s<17;s++){
    for(let i=0;i<120;i++){
      const angle=i*(Math.PI*2)/120;
      const x=16*(Math.sin(angle)**3)*s;
      const y=(13*Math.cos(angle)-5*Math.cos(2*angle)
        -2*Math.cos(3*angle)-Math.cos(4*angle))*s;

      ctx.fillText("I love you",w/2+x*fit,h/2-y*fit);
    }
  }
}
draw();
</script>
</body>
</html>
